name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build VIP_Bhop.csproj -c Release

      - name: Pack
        run: |
          cd build
          zip -r ../VIP_Bhop.zip addons

      - uses: actions/upload-artifact@v4
        with:
          name: VIP_Bhop
          path: build/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VIP_Bhop.zip
          generate_release_notes: true
